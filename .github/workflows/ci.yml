name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    env:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: https://kinetiq-api.saikat.com.bd/api/v1
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build
        run: npm run build

  docker:
    name: Build & push Docker image
    needs: build
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master' ||
       startsWith(github.ref, 'refs/tags/'))

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: mirzasaikatahmmed/kinetiq-visuals-frontend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL || 'https://kinetiq-api.saikat.com.bd/api/v1' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy web application
    needs: docker
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master' ||
       startsWith(github.ref, 'refs/tags/'))

    steps:
      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          cloudflared --version

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/server.ssh
          chmod 600 ~/.ssh/server.ssh
          # `ssh-keyscan` over the Cloudflare-tunnelled host typically fails
          # (the bastion intercepts the handshake), so we set
          # `StrictHostKeyChecking no` and route known_hosts to /dev/null in
          # the SSH config below instead of trusting on first use here.
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Setup SSH Config
        run: |
          cat >> ~/.ssh/config << 'EOF'
          Host server
              HostName ${{ secrets.VPS_HOST }}
              User ${{ secrets.VPS_USER }}
              ProxyCommand cloudflared access ssh --hostname ${{ secrets.VPS_HOST }}
              IdentityFile ~/.ssh/server.ssh
              StrictHostKeyChecking no
              LogLevel QUIET
              RequestTTY no
              UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config

      - name: Test SSH Connection
        run: ssh -q server 'echo "SSH connection successful"'

      - name: Deploy via SSH
        run: |
          set -euo pipefail
          ssh server 'cd /home/saikat/apps/kinetiq && \
            echo "==> Pulling latest '"'"'web'"'"' image from Docker Hub..." && \
            docker compose pull web && \
            echo "==> Recreating '"'"'web'"'"' container with the new image..." && \
            docker compose down web && \
            docker compose up -d web && \
            echo "==> '"'"'web'"'"' container status:" && \
            docker compose ps web'
